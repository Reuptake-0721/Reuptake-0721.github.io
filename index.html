    }
    @keyframes neural-shutdown {

  <!-- 4. 叙事化界面逻辑核心：序列化启动与过场劫持 -->
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const terminal = document.getElementById('terminal-output');
      let bootInterval;
      
      const bootSequence = [
        { text: "> INITIALIZING NEURAL LINK...", delay: 400 },
        { text: "> BYPASSING FIREWALL [0x7F8C]...", delay: 600 },
        { text: "> DAIMON.SYS MODULE: <span class='warning'>FRAGMENTED [ERR_NULL_POINTER]</span>", delay: 1200 },
        { text: "> SENSORY_ANCHOR: <span class='ok'>ESTABLISHED</span>", delay: 800 },
        { text: "> <span class='warning'>WARNING: EXTERNAL OBSERVER DETECTED.</span>", delay: 1000 },
        { text: "> RESOLVING ENTITY_ID... <span class='entity-name'>[ お尼酱~ ]</span> AUTHENTICATED.", delay: 1500 },
        { text: "> SYNCING LOCAL TIMELINE: <span id='real-time' class='system-time'></span>", delay: 400, isTime: true }
      ];

      let currentLine = 0;

      function typeLine() {
        if (currentLine >= bootSequence.length) return;
        
        const lineData = bootSequence[currentLine];
        bootInterval = setTimeout(() => {
          const p = document.createElement('p');
          p.innerHTML = lineData.text;
          terminal.appendChild(p);
          
          if (lineData.isTime) startTimeSync();
          
          currentLine++;
          typeLine();
        }, lineData.delay);
      }

      function startTimeSync() {
        const timeSpan = document.getElementById('real-time');
        setInterval(() => {
          if(!timeSpan) return;
          const now = new Date();
          const timeString = now.toISOString().replace('T', ' ').replace('Z', '').slice(0, 23);
          timeSpan.innerText = `[ ${timeString} ]`;
        }, 47); 
      }

      typeLine();

      // ==========================================
      // 过场动画控制逻辑：劫持点击事件
      // ==========================================
      const diveBtn = document.getElementById('dive-btn');
      const phenomenonLayer = document.getElementById('phenomenon-layer');
      const voidOverlay = document.getElementById('void-overlay');

      diveBtn.addEventListener('click', function(e) {
        e.preventDefault(); // 阻止浏览器瞬间跳转
        const targetUrl = this.getAttribute('href');

        // 1. 中断常规启动序列
        clearTimeout(bootInterval);

        // 2. 注入恐慌信息
        const panicNode = document.createElement('p');
        panicNode.innerHTML = "<br><span class='warning' style='font-size:1.1rem; text-shadow:0 0 15px red;'>> [!] KERNEL PANIC: EGO BOUNDARY DISSOLVING...</span>";
        terminal.appendChild(panicNode);

        // 3. 触发视知觉过载动画 (快速几何坍缩)
        phenomenonLayer.classList.add('extreme-glitch-active');

        // 4. 250ms 后，黑幕瞬间压下
        setTimeout(() => {
          voidOverlay.style.opacity = '1';
        }, 250);

        // 5. 450ms 动画收束完毕，即刻物理跳转，消除一切拖沓
        setTimeout(() => {
          window.location.href = targetUrl;
        }, 450);
      });
    });
  </script>
