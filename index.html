  <!-- 4. 叙事化界面逻辑核心：AJAX 内存级覆写 -->
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      // --- A. 页面预加载 (AJAX) ---
      const targetUrl = "/categories";
      let preloadedHTML = null;
      let isDiving = false; // 全局锁

      fetch(targetUrl)
        .then(response => response.text())
        .then(html => { preloadedHTML = html; })
        .catch(err => console.warn("Prefetch warning:", err));

      const terminal = document.getElementById('terminal-output');
      let bootInterval;
      
      const bootSequence = [
        { text: "> INITIALIZING NEURAL LINK...", delay: 400 },
        { text: "> BYPASSING FIREWALL [0x7F8C]...", delay: 600 },
        { text: "> DAIMON.SYS MODULE: <span class='warning'>FRAGMENTED [ERR_NULL_POINTER]</span>", delay: 1200 },
        { text: "> SENSORY_ANCHOR: <span class='warning'>AWAITING MANUAL OVERRIDE (CLICK HEADER)</span>", delay: 800 },
        { text: "> <span class='warning'>WARNING: EXTERNAL OBSERVER DETECTED.</span>", delay: 1000 },
        { text: "> RESOLVING ENTITY_ID... <span class='entity-name'>[ お尼酱~ ]</span> AUTHENTICATED.", delay: 1500 },
        { text: "> SYNCING LOCAL TIMELINE: <span id='real-time' class='system-time'></span>", delay: 400, isTime: true }
      ];

      let currentLine = 0;

      function typeLine() {
        if (currentLine >= bootSequence.length) return;
        const lineData = bootSequence[currentLine];
        bootInterval = setTimeout(() => {
          const p = document.createElement('p');
          p.innerHTML = lineData.text;
          terminal.appendChild(p);
          terminal.scrollTop = terminal.scrollHeight; // 自动滚屏
          
          if (lineData.isTime) startTimeSync();
          currentLine++;
          typeLine();
        }, lineData.delay);
      }

      function startTimeSync() {
        const timeSpan = document.getElementById('real-time');
        setInterval(() => {
          if(!timeSpan) return;
          const now = new Date();
          const timeString = now.toISOString().replace('T', ' ').replace('Z', '').slice(0, 23);
          timeSpan.innerText = `[ ${timeString} ]`;
        }, 47); 
      }
      typeLine();

      // --- B. 拉康式凝视视差 (Parallax Gaze) ---
      const layer = document.getElementById('phenomenon-layer');
      let idleTimer;

      document.addEventListener('mousemove', (e) => {
        if (isDiving) return; // 崩溃过程中停止响应凝视

        // 1. 物理位置偏移运算
        const xAxis = (window.innerWidth / 2 - e.pageX) / 80; // 数值越大偏转越小
        const yAxis = (window.innerHeight / 2 - e.pageY) / 80;
        layer.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;

        // 2. 互被动性监测重置
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => {
          const p = document.createElement('p');
          p.innerHTML = "> <span class='warning'>[!] OBSERVER ATTENTION DISENGAGED. SYNAPSE DECAYING...</span>";
          terminal.appendChild(p);
          terminal.scrollTop = terminal.scrollHeight;
        }, 12000); // 12秒不移动鼠标判定为失去注意力
      });

      // --- C. Web Audio API 听觉锚点 (Brown Noise 生成器) ---
      let audioCtx, noiseNode, gainNode, filterNode;
      let isAudioActive = false;
      const audioToggle = document.getElementById('audio-toggle');
      const audioStatus = document.getElementById('audio-status');

      audioToggle.addEventListener('click', function() {
        if (!audioCtx) {
          // 初始化音频图
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          
          // 生成数学级白噪声并积分转化为布朗噪声（低沉的轰鸣声）
          const bufferSize = audioCtx.sampleRate * 2; 
          const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
          const output = noiseBuffer.getChannelData(0);
          let lastOut = 0;
          for (let i = 0; i < bufferSize; i++) {
            let white = Math.random() * 2 - 1;
            output[i] = (lastOut + (0.02 * white)) / 1.02; // 布朗噪声算法
            lastOut = output[i];
            output[i] *= 3.5; // 补偿音量
          }
          
          noiseNode = audioCtx.createBufferSource();
          noiseNode.buffer = noiseBuffer;
          noiseNode.loop = true;

          // 使用低通滤波器截断高频，只保留类似“深海”或“心跳环境”的低频嗡嗡声
          filterNode = audioCtx.createBiquadFilter();
          filterNode.type = 'lowpass';
          filterNode.frequency.value = 350; 

          gainNode = audioCtx.createGain();
          gainNode.gain.value = 0.5; // 控制音量，别太吵

          noiseNode.connect(filterNode);
          filterNode.connect(gainNode);
          gainNode.connect(audioCtx.destination);
          noiseNode.start(0);
          
          isAudioActive = true;
        } else {
          if (audioCtx.state === 'running') {
            audioCtx.suspend();
            isAudioActive = false;
          } else if (audioCtx.state === 'suspended') {
            audioCtx.resume();
            isAudioActive = true;
          }
        }

        // 更新 UI 状态
        if (isAudioActive) {
          audioStatus.innerText = '[ON]';
          audioStatus.className = 'ok';
          const p = document.createElement('p');
          p.innerHTML = "> <span class='ok'>SENSORY_ANCHOR [432Hz] ONLINE. DECAY PAUSED.</span>";
          terminal.appendChild(p);
          terminal.scrollTop = terminal.scrollHeight;
        } else {
          audioStatus.innerText = '[OFF]';
          audioStatus.className = 'warning';
        }
      });

      // --- D. 极速跳切与内存覆写 ---
      const diveBtn = document.getElementById('dive-btn');
      const voidOverlay = document.getElementById('void-overlay');

      diveBtn.addEventListener('click', function(e) {
        e.preventDefault(); 
        isDiving = true; // 锁定系统，不再响应视差偏移
        layer.style.transform = "none"; // 强制归位，准备渲染崩溃动画
        clearTimeout(bootInterval);
        clearTimeout(idleTimer);

        if(audioCtx && audioCtx.state === 'running') {
          // 坍缩时制造失真：拉高滤波器频率，营造刺耳的报错感，然后迅速切断
          filterNode.frequency.exponentialRampToValueAtTime(8000, audioCtx.currentTime + 0.4);
          gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
        }

        const panicNode = document.createElement('p');
        panicNode.innerHTML = "<br><span class='warning' style='font-size:1.1rem; text-shadow:0 0 15px red;'>> [!] KERNEL PANIC: EGO BOUNDARY DISSOLVING...</span>";
        terminal.appendChild(panicNode);

        // 强行附加崩溃动画
        layer.classList.add('extreme-glitch-active');

        setTimeout(() => { voidOverlay.style.opacity = '1'; }, 540);

        setTimeout(() => {
          if (audioCtx) audioCtx.close(); // 清除音频进程
          if (preloadedHTML) {
            window.history.pushState({}, "", targetUrl);
            document.open();
            document.write(preloadedHTML);
            document.close();
          } else {
            window.location.href = targetUrl;
          }
        }, 580);
      });

      window.addEventListener('popstate', () => { window.location.reload(); });
    });
  </script>
